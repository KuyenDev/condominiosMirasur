<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="bld1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bld2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <!-- Subtle architectural skyline on right side -->
  <g transform="translate(730, 30)">
    <rect x="0" y="70" width="90" height="220" rx="12" fill="url(#bld1)"/>
    <rect x="110" y="20" width="120" height="270" rx="14" fill="url(#bld2)"/>
    <rect x="250" y="55" width="105" height="235" rx="12" fill="url(#bld1)"/>
    <rect x="372" y="95" width="82" height="195" rx="10" fill="url(#bld2)"/>
