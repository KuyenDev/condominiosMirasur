      <rect x="18" y="161" width="20" height="16" rx="4"/>
      <rect x="52" y="161" width="20" height="16" rx="4"/>

      <rect x="132" y="48" width="24" height="18" rx="4"/>
      <rect x="174" y="48" width="24" height="18" rx="4"/>
      <rect x="132" y="84" width="24" height="18" rx="4"/>
      <rect x="174" y="84" width="24" height="18" rx="4"/>
      <rect x="132" y="120" width="24" height="18" rx="4"/>
      <rect x="174" y="120" width="24" height="18" rx="4"/>
      <rect x="132" y="156" width="24" height="18" rx="4"/>
